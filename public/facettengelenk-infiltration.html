<script>const base={"de":{"back":"Zurück zu Aktuelles","guide":"Patienteninformation","langLabel":"Sprache wählen","overview":"Überblick","procedure":"Ablauf","benefits":"Vorteile","aftercare":"Danach","faq":"FAQ","appointment":"Termin buchen","contact":"Fragen vor dem Termin?","contactLink":"Schreiben Sie uns","medicalNote":"Diese Information ersetzt kein persönliches ärztliches Gespräch. Ob die Behandlung für Sie geeignet ist, klären wir nach sorgfältiger Untersuchung und Sichtung Ihrer Befunde.","duration":"Kurzer ambulanter Eingriff","imaging":"Bildgesteuert","outpatient":"In der Regel ambulant","sectionLabel":"Behandlung verständlich erklärt","whenTitle":"Wann kommt die Behandlung infrage?","prepTitle":"Vor dem Eingriff","prep":["Bitte bringen Sie vorhandene MRT-/CT-Bilder und Befunde mit.","Informieren Sie uns über Medikamente, Allergien und Vorerkrankungen.","Blutverdünnende Medikamente nur nach ärztlicher Rücksprache pausieren."],"benefitTitle":"Weniger Schmerz. Mehr Alltag.","afterTitle":"Was passiert danach?","afterText":"Nach einer kurzen Nachbeobachtung können Sie die Praxis in der Regel wieder verlassen. Organisieren Sie eine Begleitperson und fahren Sie am Behandlungstag nicht selbst. Vorübergehendes Taubheitsgefühl oder eine lokale Reizung sind möglich. Bei ungewöhnlich starken Beschwerden, Fieber oder neurologischen Ausfällen kontaktieren Sie uns bitte sofort.","faqTitle":"Häufige Fragen","ctaTitle":"Ist diese Behandlung für Sie geeignet?","ctaText":"Wir prüfen Ihre Beschwerden und vorhandenen Aufnahmen individuell und besprechen transparent die nächsten Schritte.","footer":"Wirbelsäulenzentrum am Stiglmaierplatz · Nymphenburger Str. 1 · 80335 München","download":"PDF herunterladen"},"en":{"back":"Back to News","guide":"Patient guide","langLabel":"Choose language","overview":"Overview","procedure":"Procedure","benefits":"Benefits","aftercare":"Aftercare","faq":"FAQ","appointment":"Book appointment","contact":"Questions before booking?","contactLink":"Write to us","medicalNote":"This information does not replace a personal medical consultation. We determine whether the treatment is suitable for you after a careful examination and review of your findings.","duration":"Short outpatient procedure","imaging":"Image-guided","outpatient":"Usually outpatient","sectionLabel":"Treatment explained clearly","whenTitle":"When may this treatment be considered?","prepTitle":"Before the procedure","prep":["Please bring any existing MRI/CT images and reports.","Tell us about medication, allergies and pre-existing conditions.","Only stop blood-thinning medication after medical advice."],"benefitTitle":"Less pain. More everyday life.","afterTitle":"What happens afterwards?","afterText":"After a short observation period, you can usually leave the practice. Arrange for someone to accompany you and do not drive yourself on the day of treatment. Temporary numbness or local irritation may occur. Contact us immediately if you experience unusually severe symptoms, fever or neurological deficits.","faqTitle":"Frequently asked questions","ctaTitle":"Is this treatment right for you?","ctaText":"We assess your symptoms and available scans individually and discuss the next steps transparently.","footer":"Spine Center at Stiglmaierplatz · Nymphenburger Str. 1 · 80335 Munich","download":"Download PDF"},"es":{"back":"Volver a Actualidad","guide":"Información para pacientes","langLabel":"Elegir idioma","overview":"Resumen","procedure":"Procedimiento","benefits":"Beneficios","aftercare":"Después","faq":"Preguntas","appointment":"Solicitar cita","contact":"¿Tiene preguntas antes de pedir cita?","contactLink":"Escríbanos","medicalNote":"Esta información no sustituye una consulta médica personal. Determinamos si el tratamiento es adecuado para usted tras una exploración cuidadosa y la revisión de sus informes.","duration":"Procedimiento ambulatorio breve","imaging":"Guiado por imagen","outpatient":"Normalmente ambulatorio","sectionLabel":"El tratamiento, explicado con claridad","whenTitle":"¿Cuándo puede considerarse este tratamiento?","prepTitle":"Antes del procedimiento","prep":["Traiga las imágenes e informes de RM/TC disponibles.","Infórmenos sobre medicación, alergias y enfermedades previas.","Suspenda anticoagulantes únicamente tras indicación médica."],"benefitTitle":"Menos dolor. Más vida cotidiana.","afterTitle":"¿Qué ocurre después?","afterText":"Tras un breve periodo de observación, normalmente puede abandonar la consulta. Organice que alguien le acompañe y no conduzca el día del tratamiento. Puede aparecer entumecimiento temporal o irritación local. Contáctenos de inmediato ante síntomas inusualmente intensos, fiebre o déficits neurológicos.","faqTitle":"Preguntas frecuentes","ctaTitle":"¿Es este tratamiento adecuado para usted?","ctaText":"Valoramos individualmente sus síntomas y estudios disponibles y explicamos con transparencia los siguientes pasos.","footer":"Centro de Columna de Stiglmaierplatz · Nymphenburger Str. 1 · 80335 Múnich","download":"Descargar PDF"},"it":{"back":"Torna alle Novità","guide":"Informazioni per i pazienti","langLabel":"Scegli la lingua","overview":"Panoramica","procedure":"Procedura","benefits":"Benefici","aftercare":"Dopo","faq":"Domande","appointment":"Prenota una visita","contact":"Domande prima dell'appuntamento?","contactLink":"Scriveteci","medicalNote":"Queste informazioni non sostituiscono un colloquio medico personale. Valutiamo se il trattamento è adatto a lei dopo un esame accurato e la revisione dei referti.","duration":"Breve procedura ambulatoriale","imaging":"Guidata da immagini","outpatient":"Generalmente ambulatoriale","sectionLabel":"Il trattamento spiegato con chiarezza","whenTitle":"Quando può essere indicato questo trattamento?","prepTitle":"Prima della procedura","prep":["Porti con sé immagini e referti RM/TC disponibili.","Ci informi su farmaci, allergie e patologie preesistenti.","Sospenda gli anticoagulanti solo su indicazione medica."],"benefitTitle":"Meno dolore. Più vita quotidiana.","afterTitle":"Cosa succede dopo?","afterText":"Dopo un breve periodo di osservazione, di norma può lasciare lo studio. Si faccia accompagnare e non guidi il giorno del trattamento. Possono comparire intorpidimento temporaneo o irritazione locale. In caso di sintomi insolitamente intensi, febbre o deficit neurologici, ci contatti immediatamente.","faqTitle":"Domande frequenti","ctaTitle":"Questo trattamento è adatto a lei?","ctaText":"Valutiamo individualmente i sintomi e le immagini disponibili e discutiamo con trasparenza i passi successivi.","footer":"Centro della Colonna di Stiglmaierplatz · Nymphenburger Str. 1 · 80335 Monaco","download":"Scarica PDF"}};const content={"de":{"title":"Facettengelenk-Infiltration","subtitle":"Gezielte Behandlung direkt am schmerzhaften Gelenk","intro":"Bei einer Facettengelenk-Infiltration wird eine kleine Menge örtliches Betäubungsmittel, gegebenenfalls kombiniert mit einem entzündungshemmenden Medikament, präzise an das betroffene Wirbelgelenk gegeben. Die Behandlung kann Schmerzen lindern und zugleich helfen, deren Ursprung zu bestätigen.","when":"Sie kann bei Rücken- oder Nackenschmerzen infrage kommen, wenn Untersuchung und Bildgebung auf gereizte oder verschleißbedingte Facettengelenke als Schmerzquelle hinweisen.","steps":[["Bildgebung","Unter Röntgen- oder CT-Kontrolle wird das betroffene Facettengelenk präzise dargestellt."],["Positionierung","Nach Hautdesinfektion und örtlicher Betäubung wird eine sehr feine Nadel kontrolliert an das Gelenk geführt."],["Injektion","Eine kleine Medikamentenmenge wird gezielt verabreicht. Die Verteilung lässt sich bei Bedarf mit Kontrastmittel prüfen."],["Nachbeobachtung","Nach einer kurzen Kontrollphase dokumentieren wir die Wirkung und besprechen das weitere Vorgehen."]],"benefits":[["Präzise","Das Medikament gelangt direkt an die vermutete Schmerzquelle."],["Diagnostisch wertvoll","Die Reaktion hilft, den Schmerzursprung einzugrenzen."],["Minimalinvasiv","Nur ein kleiner Nadelzugang ist erforderlich."],["Ambulant","Die Behandlung dauert meist nur kurze Zeit."],["Mehr Bewegung","Weniger Schmerz kann aktive Therapie erleichtern."]],"faqs":[["Ist die Infiltration schmerzhaft?","Die Haut wird örtlich betäubt. Beim Vorschieben der Nadel oder bei der Injektion kann kurz ein Druckgefühl auftreten."],["Wann wirkt die Behandlung?","Das örtliche Betäubungsmittel kann rasch wirken. Die entzündungshemmende Wirkung kann sich über mehrere Tage entwickeln."],["Wie lange hält die Wirkung?","Das ist individuell und hängt unter anderem von der Ursache der Beschwerden ab. Die Wirkung kann vorübergehend sein; ihr Verlauf liefert wichtige diagnostische Hinweise."],["Wie oft kann infiltriert werden?","Ob und wann eine Wiederholung sinnvoll ist, wird anhand von Wirkung, Diagnose, Medikament und Ihrer individuellen Situation entschieden."],["Welche Risiken gibt es?","Möglich sind Bluterguss, vorübergehende Taubheit, eine kurzfristige Schmerzverstärkung, allergische Reaktion oder Infektion. Ernste Komplikationen sind selten."]]},"en":{"title":"Facet Joint Injection","subtitle":"Targeted treatment directly at the painful joint","intro":"A facet joint injection delivers a small amount of local anaesthetic, sometimes combined with anti-inflammatory medication, precisely to the affected spinal joint. It may relieve pain and also help confirm where the pain originates.","when":"It may be considered for back or neck pain when examination and imaging suggest irritated or degenerative facet joints as the source.","steps":[["Imaging","X-ray or CT guidance shows the affected facet joint precisely."],["Positioning","After skin disinfection and local anaesthesia, a very fine needle is guided to the joint under continuous control."],["Injection","A small amount of medication is administered precisely. Contrast medium may be used to verify distribution."],["Observation","After a short monitoring period, we document the response and discuss the next steps."]],"benefits":[["Precise","Medication is delivered directly to the suspected pain source."],["Diagnostic value","Your response helps narrow down the source of pain."],["Minimally invasive","Only a small needle entry is required."],["Outpatient","The treatment usually takes only a short time."],["More movement","Less pain can make active therapy easier."]],"faqs":[["Is the injection painful?","The skin is numbed locally. You may briefly feel pressure as the needle advances or the medication is injected."],["When does it work?","The local anaesthetic can work quickly. The anti-inflammatory effect may develop over several days."],["How long does it last?","This varies and depends partly on the cause of the symptoms. Relief may be temporary; its course provides useful diagnostic information."],["How often can it be repeated?","Whether and when repetition is appropriate depends on the response, diagnosis, medication and your individual situation."],["What are the risks?","Bruising, temporary numbness, a short-term pain flare, allergic reaction or infection are possible. Serious complications are rare."]]},"es":{"title":"Infiltración de las articulaciones facetarias","subtitle":"Tratamiento preciso directamente en la articulación dolorosa","intro":"La infiltración facetaria administra una pequeña cantidad de anestésico local, a veces combinado con un antiinflamatorio, directamente en la articulación vertebral afectada. Puede aliviar el dolor y ayudar a confirmar su origen.","when":"Puede considerarse para dolor cervical o lumbar cuando la exploración y las imágenes indican que las facetas irritadas o degeneradas son la posible fuente.","steps":[["Imagen","La guía por rayos X o TC muestra con precisión la articulación afectada."],["Posicionamiento","Tras desinfectar y anestesiar la piel, se guía una aguja muy fina hasta la articulación."],["Infiltración","Se administra una pequeña cantidad de medicación. Si es necesario, se comprueba su distribución con contraste."],["Observación","Tras un breve control, documentamos la respuesta y explicamos los siguientes pasos."]],"benefits":[["Preciso","El medicamento llega directamente a la posible fuente del dolor."],["Valor diagnóstico","La respuesta ayuda a delimitar el origen del dolor."],["Mínimamente invasivo","Solo requiere la entrada de una aguja fina."],["Ambulatorio","El tratamiento suele durar poco tiempo."],["Más movimiento","Menos dolor puede facilitar la terapia activa."]],"faqs":[["¿Duele la infiltración?","La piel se anestesia localmente. Puede sentir presión brevemente al avanzar la aguja o inyectar la medicación."],["¿Cuándo hace efecto?","El anestésico local puede actuar rápidamente. El efecto antiinflamatorio puede desarrollarse durante varios días."],["¿Cuánto dura?","Varía y depende, entre otros factores, de la causa. El alivio puede ser temporal; su evolución aporta información diagnóstica útil."],["¿Cuántas veces puede repetirse?","La conveniencia y el momento de repetirla dependen de la respuesta, el diagnóstico, el medicamento y su situación individual."],["¿Qué riesgos existen?","Son posibles hematoma, entumecimiento temporal, aumento breve del dolor, reacción alérgica o infección. Las complicaciones graves son raras."]]},"it":{"title":"Infiltrazione delle faccette articolari","subtitle":"Trattamento mirato direttamente sull'articolazione dolorosa","intro":"L'infiltrazione delle faccette somministra una piccola quantità di anestetico locale, talvolta associato a un farmaco antinfiammatorio, direttamente nell'articolazione interessata. Può alleviare il dolore e aiutare a confermarne l'origine.","when":"Può essere indicata per dolore cervicale o lombare quando esame e immagini suggeriscono faccette irritate o degenerative come possibile fonte.","steps":[["Imaging","La guida radiografica o TC mostra con precisione la faccetta interessata."],["Posizionamento","Dopo disinfezione e anestesia locale, un ago molto sottile viene guidato fino all'articolazione."],["Infiltrazione","Viene somministrata una piccola quantità di farmaco. Se necessario, il contrasto ne verifica la distribuzione."],["Osservazione","Dopo un breve controllo, documentiamo la risposta e discutiamo i passi successivi."]],"benefits":[["Precisa","Il farmaco arriva direttamente alla sospetta fonte del dolore."],["Valore diagnostico","La risposta aiuta a individuare l'origine del dolore."],["Mininvasiva","Richiede solo l'accesso di un ago sottile."],["Ambulatoriale","Il trattamento richiede in genere poco tempo."],["Più movimento","Meno dolore può facilitare la terapia attiva."]],"faqs":[["L'infiltrazione è dolorosa?","La pelle viene anestetizzata localmente. Può avvertire brevemente pressione durante l'avanzamento dell'ago o l'iniezione."],["Quando fa effetto?","L'anestetico locale può agire rapidamente. L'effetto antinfiammatorio può svilupparsi nell'arco di alcuni giorni."],["Quanto dura?","Varia e dipende anche dalla causa dei disturbi. Il sollievo può essere temporaneo; il suo andamento fornisce utili informazioni diagnostiche."],["Quante volte si può ripetere?","L'opportunità e il momento di una ripetizione dipendono da risposta, diagnosi, farmaco e situazione individuale."],["Quali sono i rischi?","Sono possibili ematoma, intorpidimento temporaneo, breve aumento del dolore, reazione allergica o infezione. Le complicanze gravi sono rare."]]}};const buttons=[...document.querySelectorAll('.langs button')];function setLang(lang){if(!base[lang]||!content[lang])lang='de';document.documentElement.lang=lang;document.querySelectorAll('[data-key]').forEach(el=>el.textContent=base[lang][el.dataset.key]||'');document.querySelectorAll('[data-treatment]').forEach(el=>el.textContent=content[lang][el.dataset.treatment]||'');document.getElementById('prep').innerHTML=base[lang].prep.map(x=>`<li>${x}</li>`).join('');document.getElementById('steps').innerHTML=content[lang].steps.map((x,i)=>`<article class="step"><span class="num">0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');document.getElementById('benefit-grid').innerHTML=content[lang].benefits.map((x,i)=>`<article class="benefit"><span>0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');document.getElementById('faqs').innerHTML=content[lang].faqs.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('');document.title=content[lang].title+' · WZAS München';document.getElementById('doc-description').content=content[lang].intro;document.getElementById('og-title').content=document.title;document.getElementById('og-description').content=content[lang].intro;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));localStorage.setItem('wzas-guide-lang',lang)}buttons.forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));setLang(localStorage.getItem('wzas-guide-lang')||'de');</script></body></html>
