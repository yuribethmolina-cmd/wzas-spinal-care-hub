ntment":"Book appointment","contact":"Questions before booking?","contactLink":"Write to us","medicalNote":"This information does not replace a personal medical consultation. We determine whether the treatment is suitable for you after a careful examination and review of your findings.","duration":"Short outpatient procedure","imaging":"Image-guided","outpatient":"Usually outpatient","sectionLabel":"Treatment explained clearly","whenTitle":"When may this treatment be considered?","prepTitle":"Before the procedure","prep":["Please bring any existing MRI/CT images and reports.","Tell us about medication, allergies and pre-existing conditions.","Only stop blood-thinning medication after medical advice."],"benefitTitle":"Less pain. More everyday life.","afterTitle":"What happens afterwards?","afterText":"After a short observation period, you can usually leave the practice. Arrange for someone to accompany you and do not drive yourself on the day of treatment. Temporary numbness or local irritation may occur. Contact us immediately if you experience unusually severe symptoms, fever or neurological deficits.","faqTitle":"Frequently asked questions","ctaTitle":"Is this treatment right for you?","ctaText":"We assess your symptoms and available scans individually and discuss the next steps transparently.","footer":"Spine Center at Stiglmaierplatz · Nymphenburger Str. 1 · 80335 Munich","download":"Download PDF"},"es":{"back":"Volver a Actualidad","guide":"Información para pacientes","photoLabel":"Preciso. Cuidadoso. Ambulatorio.","photoStatement":"Cuatro pasos guiados con precisión","langLabel":"Elegir idioma","overview":"Resumen","procedure":"Procedimiento","galleryNav":"Así será","galleryKicker":"Su recorrido durante el tratamiento","galleryTitle":"Qué puede esperar en WZAS","galleryLead":"Cinco etapas tranquilas y claramente acompañadas, desde la consulta personal hasta volver a casa.","swipe":"Deslice para ver →","journey":[["Consulta","Le explicamos con calma sus síntomas, sus imágenes y cada paso del tratamiento."],["Preparación","Una exploración y preparación cuidadosas aportan seguridad antes del procedimiento."],["Control por imagen","La zona se localiza y controla con precisión mediante tecnología de imagen moderna."],["Procedimiento","El tratamiento se realiza de forma precisa, mínimamente invasiva y bajo control continuo."],["Observación","Tras un breve descanso y control, explicamos las indicaciones para casa."]],"benefits":"Beneficios","aftercare":"Después","faq":"Preguntas","appointment":"Solicitar cita","contact":"¿Tiene preguntas antes de pedir cita?","contactLink":"Escríbanos","medicalNote":"Esta información no sustituye una consulta médica personal. Determinamos si el tratamiento es adecuado para usted tras una exploración cuidadosa y la revisión de sus informes.","duration":"Procedimiento ambulatorio breve","imaging":"Guiado por imagen","outpatient":"Normalmente ambulatorio","sectionLabel":"El tratamiento, explicado con claridad","whenTitle":"¿Cuándo puede considerarse este tratamiento?","prepTitle":"Antes del procedimiento","prep":["Traiga las imágenes e informes de RM/TC disponibles.","Infórmenos sobre medicación, alergias y enfermedades previas.","Suspenda anticoagulantes únicamente tras indicación médica."],"benefitTitle":"Menos dolor. Más vida cotidiana.","afterTitle":"¿Qué ocurre después?","afterText":"Tras un breve periodo de observación, normalmente puede abandonar la consulta. Organice que alguien le acompañe y no conduzca el día del tratamiento. Puede aparecer entumecimiento temporal o irritación local. Contáctenos de inmediato ante síntomas inusualmente intensos, fiebre o déficits neurológicos.","faqTitle":"Preguntas frecuentes","ctaTitle":"¿Es este tratamiento adecuado para usted?","ctaText":"Valoramos individualmente sus síntomas y estudios disponibles y explicamos con transparencia los siguientes pasos.","footer":"Centro de Columna de Stiglmaierplatz · Nymphenburger Str. 1 · 80335 Múnich","download":"Descargar PDF"},"it":{"back":"Torna alle Novità","guide":"Informazioni per i pazienti","photoLabel":"Precisa. Delicata. Ambulatoriale.","photoStatement":"Quattro passaggi guidati con cura","langLabel":"Scegli la lingua","overview":"Panoramica","procedure":"Procedura","galleryNav":"Il percorso","galleryKicker":"Il suo percorso di trattamento","galleryTitle":"Cosa aspettarsi al WZAS","galleryLead":"Cinque fasi tranquille e ben accompagnate, dal colloquio personale fino al ritorno a casa.","swipe":"Scorra per vedere →","journey":[["Colloquio","Spieghiamo con calma i sintomi, le immagini e ogni fase del trattamento."],["Preparazione","Un esame e una preparazione accurati offrono sicurezza prima della procedura."],["Controllo immagini","La zona viene localizzata e controllata con precisione mediante immagini moderne."],["Trattamento","La procedura è mirata, mininvasiva e costantemente controllata."],["Osservazione","Dopo un breve riposo e controllo, spieghiamo le indicazioni per casa."]],"benefits":"Benefici","aftercare":"Dopo","faq":"Domande","appointment":"Prenota una visita","contact":"Domande prima dell'appuntamento?","contactLink":"Scriveteci","medicalNote":"Queste informazioni non sostituiscono un colloquio medico personale. Valutiamo se il trattamento è adatto a lei dopo un esame accurato e la revisione dei referti.","duration":"Breve procedura ambulatoriale","imaging":"Guidata da immagini","outpatient":"Generalmente ambulatoriale","sectionLabel":"Il trattamento spiegato con chiarezza","whenTitle":"Quando può essere indicato questo trattamento?","prepTitle":"Prima della procedura","prep":["Porti con sé immagini e referti RM/TC disponibili.","Ci informi su farmaci, allergie e patologie preesistenti.","Sospenda gli anticoagulanti solo su indicazione medica."],"benefitTitle":"Meno dolore. Più vita quotidiana.","afterTitle":"Cosa succede dopo?","afterText":"Dopo un breve periodo di osservazione, di norma può lasciare lo studio. Si faccia accompagnare e non guidi il giorno del trattamento. Possono comparire intorpidimento temporaneo o irritazione locale. In caso di sintomi insolitamente intensi, febbre o deficit neurologici, ci contatti immediatamente.","faqTitle":"Domande frequenti","ctaTitle":"Questo trattamento è adatto a lei?","ctaText":"Valutiamo individualmente i sintomi e le immagini disponibili e discutiamo con trasparenza i passi successivi.","footer":"Centro della Colonna di Stiglmaierplatz · Nymphenburger Str. 1 · 80335 Monaco","download":"Scarica PDF"}};const content={"de":{"title":"Facettengelenk-Thermodenervation","subtitle":"Schmerzlinderung durch gezielte Wärme","intro":"Bei der Thermodenervation werden kleine Nervenäste, die Schmerzsignale aus den Wirbelgelenken weiterleiten, mit kontrollierter Wärme behandelt. Ziel ist es, anhaltende Rückenschmerzen zu reduzieren, ohne die Beweglichkeit der Wirbelsäule einzuschränken.","when":"Sie kann bei chronischen, durch die Facettengelenke verursachten Rücken- oder Nackenschmerzen infrage kommen – insbesondere, wenn diagnostische Testinfiltrationen eine deutliche, aber zeitlich begrenzte Besserung gebracht haben.","steps":[["Bildgebung","Unter Röntgen- oder CT-Kontrolle wird die genaue Position des betroffenen Gelenks bestimmt."],["Sonde","Eine sehr feine Sonde wird nach örtlicher Betäubung präzise an den schmerzleitenden Nervenast geführt."],["Erwärmung","Die Sondenspitze erzeugt kontrollierte Wärme. Dadurch wird die Weiterleitung des Schmerzsignals gezielt unterbrochen."],["Nachbeobachtung","Nach einer kurzen Ruhe- und Kontrollphase besprechen wir das Verhalten für die nächsten Tage."]],"benefits":[["Gezielt","Behandlung der schmerzleitenden Nervenäste."],["Minimalinvasiv","Nur ein kleiner Hautzugang ist erforderlich."],["Beweglichkeit erhalten","Die Stabilität des Gelenks bleibt unberührt."],["Ambulant","Meist ohne stationären Aufenthalt möglich."],["Mehr Alltag","Die Wirkung kann über mehrere Monate anhalten."]],"faqs":[["Ist die Behandlung schmerzhaft?","Die Einstichstelle wird örtlich betäubt. Während der Positionierung oder Erwärmung können Sie kurz Druck oder Wärme wahrnehmen."],["Wann setzt die Wirkung ein?","Eine Verbesserung kann nach wenigen Tagen beginnen. Durch eine vorübergehende Reizung kann die Wirkung auch erst nach zwei bis vier Wochen vollständig beurteilt werden."],["Wie lange hält die Wirkung?","Die Dauer ist individuell. Häufig hält die Schmerzlinderung mehrere Monate an; die behandelten Nerven können sich mit der Zeit regenerieren."],["Kann der Eingriff wiederholt werden?","Wenn die Beschwerden nach einer längeren Besserung zurückkehren und erneut eindeutig den Facettengelenken zugeordnet werden, kann eine Wiederholung geprüft werden."],["Welche Risiken gibt es?","Möglich sind vorübergehende lokale Schmerzen, Bluterguss, Taubheitsgefühl oder Infektion. Ernste Komplikationen sind selten und werden im Aufklärungsgespräch individuell erläutert."]]},"en":{"title":"Facet Joint Thermodenervation","subtitle":"Pain relief through controlled heat","intro":"Thermodenervation uses controlled heat to treat small nerve branches that transmit pain signals from the facet joints. The aim is to reduce persistent back pain without limiting spinal mobility.","when":"It may be considered for chronic back or neck pain arising from the facet joints—especially when diagnostic test injections produced clear but temporary relief.","steps":[["Imaging","X-ray or CT guidance identifies the exact position of the affected joint."],["Probe","After local anaesthesia, a very fine probe is guided precisely to the pain-transmitting nerve branch."],["Heating","The probe tip produces controlled heat, selectively interrupting transmission of the pain signal."],["Observation","After a short rest and monitoring period, we discuss what to observe over the next few days."]],"benefits":[["Targeted","Treats the nerve branches that carry pain signals."],["Minimally invasive","Only a small skin entry is required."],["Mobility preserved","The stability of the joint remains unaffected."],["Outpatient","Usually possible without a hospital stay."],["More daily life","The effect may last for several months."]],"faqs":[["Is the treatment painful?","The entry site is numbed locally. You may briefly feel pressure or warmth during positioning or heating."],["When does it start working?","Improvement can begin within a few days. Because temporary irritation is possible, the full effect may take two to four weeks to assess."],["How long does the effect last?","Duration varies. Pain relief often lasts several months; the treated nerves can regenerate over time."],["Can the procedure be repeated?","If symptoms return after prolonged relief and can again be clearly attributed to the facet joints, repeat treatment may be considered."],["What are the risks?","Temporary local pain, bruising, numbness or infection are possible. Serious complications are rare and are explained individually during consent."]]},"es":{"title":"Termodenervación de las articulaciones facetarias","subtitle":"Alivio del dolor mediante calor controlado","intro":"La termodenervación trata con calor controlado pequeñas ramas nerviosas que transmiten señales de dolor desde las articulaciones facetarias. El objetivo es reducir el dolor persistente sin limitar la movilidad de la columna.","when":"Puede considerarse para dolor crónico cervical o lumbar originado en las articulaciones facetarias, especialmente si las infiltraciones diagnósticas produjeron un alivio claro pero temporal.","steps":[["Imagen","La guía por rayos X o TC permite localizar con exactitud la articulación afectada."],["Sonda","Tras anestesia local, se conduce una sonda muy fina hasta la rama nerviosa que transmite el dolor."],["Calentamiento","La punta genera calor controlado e interrumpe selectivamente la transmisión de la señal dolorosa."],["Observación","Tras un breve periodo de descanso y control, explicamos las pautas para los días siguientes."]],"benefits":[["Preciso","Actúa sobre las ramas nerviosas que transmiten el dolor."],["Mínimamente invasivo","Solo requiere un pequeño acceso cutáneo."],["Conserva la movilidad","No altera la estabilidad de la articulación."],["Ambulatorio","Normalmente no requiere hospitalización."],["Más vida diaria","El efecto puede durar varios meses."]],"faqs":[["¿Es doloroso?","La zona de entrada se anestesia localmente. Puede notar presión o calor brevemente durante el posicionamiento o calentamiento."],["¿Cuándo aparece el efecto?","La mejoría puede comenzar en pocos días. Debido a una posible irritación temporal, el resultado completo puede valorarse tras dos a cuatro semanas."],["¿Cuánto dura?","La duración varía. El alivio suele mantenerse varios meses; los nervios tratados pueden regenerarse con el tiempo."],["¿Puede repetirse?","Si el dolor reaparece tras una mejoría prolongada y vuelve a atribuirse claramente a las facetas, puede estudiarse una repetición."],["¿Qué riesgos existen?","Son posibles dolor local transitorio, hematoma, entumecimiento o infección. Las complicaciones graves son raras y se explican individualmente."]]},"it":{"title":"Termodenervazione delle faccette articolari","subtitle":"Sollievo dal dolore mediante calore controllato","intro":"La termodenervazione tratta con calore controllato piccoli rami nervosi che trasmettono i segnali dolorosi dalle faccette articolari. L'obiettivo è ridurre il dolore persistente senza limitare la mobilità della colonna.","when":"Può essere indicata per dolore cronico cervicale o lombare originato dalle faccette, soprattutto quando infiltrazioni diagnostiche hanno dato un sollievo netto ma temporaneo.","steps":[["Imaging","La guida radiografica o TC individua con precisione l'articolazione interessata."],["Sonda","Dopo anestesia locale, una sonda molto sottile viene portata al ramo nervoso che trasmette il dolore."],["Riscaldamento","La punta produce calore controllato, interrompendo selettivamente la trasmissione del segnale doloroso."],["Osservazione","Dopo un breve periodo di riposo e controllo, spieghiamo le indicazioni per i giorni successivi."]],"benefits":[["Mirata","Tratta i rami nervosi che trasmettono il dolore."],["Mininvasiva","Richiede solo un piccolo accesso cutaneo."],["Mobilità preservata","La stabilità dell'articolazione resta invariata."],["Ambulatoriale","In genere non richiede ricovero."],["Più quotidianità","L'effetto può durare diversi mesi."]],"faqs":[["Il trattamento è doloroso?","Il punto di accesso viene anestetizzato localmente. Durante il posizionamento o il riscaldamento può avvertire brevemente pressione o calore."],["Quando inizia l'effetto?","Il miglioramento può iniziare dopo pochi giorni. Per una possibile irritazione transitoria, l'effetto completo può essere valutato dopo due-quattro settimane."],["Quanto dura l'effetto?","La durata è individuale. Il sollievo spesso dura diversi mesi; i nervi trattati possono rigenerarsi nel tempo."],["Si può ripetere?","Se i sintomi tornano dopo un beneficio prolungato e sono nuovamente attribuiti alle faccette, si può valutare una ripetizione."],["Quali sono i rischi?","Sono possibili dolore locale temporaneo, ematoma, intorpidimento o infezione. Le complicanze gravi sono rare e vengono spiegate individualmente."]]}};const journeyImages=["/__l5e/assets-v1/585dff7d-8041-4df7-8a05-01dfce2d77d0/praxis-beratung.webp", "/__l5e/assets-v1/da9f0c65-6117-4246-aceb-2f199ee798cc/praxis-untersuchung.webp", "/__l5e/assets-v1/263941fa-7105-4002-83e9-3b53e5c8bf67/praxis-ct.webp", "/treatment-minimalinvasiv.webp", "/__l5e/assets-v1/dff5919a-4e94-413f-8d40-29456cd1100e/praxis-empfang.webp"];const buttons=[...document.querySelectorAll('.langs button')];function setLang(lang){if(!base[lang]||!content[lang])lang='de';document.documentElement.lang=lang;document.querySelectorAll('[data-key]').forEach(el=>el.textContent=base[lang][el.dataset.key]||'');document.querySelectorAll('[data-treatment]').forEach(el=>el.textContent=content[lang][el.dataset.treatment]||'');document.getElementById('prep').innerHTML=base[lang].prep.map(x=>`<li>${x}</li>`).join('');document.getElementById('journey-grid').innerHTML=base[lang].journey.map((x,i)=>`<article class="journey-card"><div class="journey-image"><img src="${journeyImages[i]}" alt="${x[0]} – WZAS" width="1366" height="768" loading="lazy" decoding="async"><span class="journey-number">0${i+1}</span></div><div class="journey-copy"><h3>${x[0]}</h3><p>${x[1]}</p></div></article>`).join('');document.getElementById('steps').innerHTML=content[lang].steps.map((x,i)=>`<article class="step"><span class="num">0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');document.getElementById('benefit-grid').innerHTML=content[lang].benefits.map((x,i)=>`<article class="benefit"><span>0${i+1}</span><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');document.getElementById('faqs').innerHTML=content[lang].faqs.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('');document.title=content[lang].title+' · WZAS München';document.getElementById('doc-description').content=content[lang].intro;document.getElementById('og-title').content=document.title;document.getElementById('og-description').content=content[lang].intro;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));document.querySelectorAll('[data-pdf-download]').forEach(link=>{link.href=pdfByLang[lang];link.download=content[lang].title+'-'+lang.toUpperCase()+'.pdf'});localStorage.setItem('wzas-guide-lang',lang)}buttons.forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));setLang(localStorage.getItem('wzas-guide-lang')||'de');</script></body></html>
